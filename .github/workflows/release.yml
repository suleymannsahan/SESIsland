# Builds the Windows installer and zip when a version tag (v1.2.3) is pushed,
# and attaches them to a GitHub Release. Ada's update check reads that release.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx electron-builder --win nsis zip --x64 --publish never
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Ada-Setup-*.exe
            dist/Ada-*-win.zip
          generate_release_notes: true
